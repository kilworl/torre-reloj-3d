<!DOCTYPE html>
<html lang="es">
<head>

<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #000; font-family: Georgia, serif; }
  canvas { display: block; }
  #overlay {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(8, 12, 20, 0.72); z-index: 10; cursor: pointer; backdrop-filter: blur(4px);

<script type="module">
import * as THREE from 'three';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

// ---------- Renderer / escena / cámara ----------
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.1, 900);
camera.position.set(12, 1.7, 30);
camera.lookAt(0, 14, 0);
window.__cam = camera;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const maxAniso = renderer.capabilities.getMaxAnisotropy();

// ---------- Texturas procedurales ----------
function makeCanvasTex(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = maxAniso;
  return t;
}

function stuccoTexture(base, dark, light) {
  return makeCanvasTex(512, 512, (g) => {
    g.fillStyle = base; g.fillRect(0, 0, 512, 512);
    for (let i = 0; i < 4500; i++) {
      g.globalAlpha = 0.04 + Math.random() * 0.07;
      g.fillStyle = Math.random() < 0.5 ? dark : light;
      g.fillRect(Math.random() * 512, Math.random() * 512, 1 + Math.random() * 3, 1 + Math.random() * 3);
    }
    for (let i = 0; i < 28; i++) {
      g.globalAlpha = 0.05;
      g.fillStyle = dark;
      g.beginPath();
      g.ellipse(Math.random() * 512, Math.random() * 512, 20 + Math.random() * 70, 10 + Math.random() * 45, Math.random() * 3, 0, 7);
      g.fill();
    }
    g.globalAlpha = 1;
  });
}

function floorTexture() {
  return makeCanvasTex(512, 512, (g) => {
    const T = 128;
    for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) {
      const v = 138 + Math.floor(Math.random() * 34);
      g.fillStyle = `rgb(${v},${v - 6},${v - 16})`;
      g.fillRect(x * T, y * T, T, T);
    }
    g.strokeStyle = 'rgba(48,42,36,0.85)';
    g.lineWidth = 4;
    for (let i = 0; i <= 4; i++) {
      g.beginPath(); g.moveTo(i * T, 0); g.lineTo(i * T, 512); g.stroke();
      g.beginPath(); g.moveTo(0, i * T); g.lineTo(512, i * T); g.stroke();
    }
    for (let i = 0; i < 2500; i++) {
      g.globalAlpha = 0.06;
      g.fillStyle = Math.random() < 0.5 ? '#5a5248' : '#d8d0c2';
      g.fillRect(Math.random() * 512, Math.random() * 512, 2, 2);
    }
    g.globalAlpha = 1;
  });
}

function roofTexture() {
  return makeCanvasTex(256, 256, (g) => {
    g.fillStyle = '#8f4126'; g.fillRect(0, 0, 256, 256);
    for (let y = 0; y < 256; y += 22) {
      for (let x = 0; x < 256; x += 20) {
        const v = Math.random();
        g.fillStyle = v < 0.33 ? '#a14a2c' : v < 0.66 ? '#b85b38' : '#96492b';
        g.beginPath();
        g.arc(x + 10, y + 22, 10, Math.PI, 0);
        g.fill();
      }
      g.fillStyle = 'rgba(40,18,10,0.5)';
      g.fillRect(0, y + 20, 256, 3);
    }
  });
}

function frondTexture() {
  const t = makeCanvasTex(128, 512, (g) => {
    g.clearRect(0, 0, 128, 512);
    g.strokeStyle = '#3f6d2e'; g.lineWidth = 6;
    g.beginPath(); g.moveTo(64, 0); g.lineTo(64, 512); g.stroke();
    for (let y = 14; y < 500; y += 13) {
      const len = 52 * (1 - Math.abs(y - 240) / 620);
      const sag = 16 + y * 0.03;
      g.strokeStyle = Math.random() < 0.5 ? '#4a7d35' : '#557f2f';
      g.lineWidth = 4;
      g.beginPath(); g.moveTo(64, y); g.lineTo(64 - len, y + sag); g.stroke();
      g.beginPath(); g.moveTo(64, y); g.lineTo(64 + len, y + sag); g.stroke();
    }
  });
  t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping;
  return t;
}

function archOpeningTexture() {
  const t = makeCanvasTex(128, 256, (g) => {
    g.clearRect(0, 0, 128, 256);
    g.fillStyle = '#171008';
    g.beginPath();
    g.moveTo(16, 256); g.lineTo(16, 70);
    g.arc(64, 70, 48, Math.PI, 0);
    g.lineTo(112, 256); g.closePath(); g.fill();
  });
  t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping;
  return t;
}

function facadeTexture(base) {
  return makeCanvasTex(512, 512, (g) => {
    g.fillStyle = base; g.fillRect(0, 0, 512, 512);
    for (let i = 0; i < 3000; i++) {
      g.globalAlpha = 0.05;
      g.fillStyle = Math.random() < 0.5 ? '#241a10' : '#fff2d8';
      g.fillRect(Math.random() * 512, Math.random() * 512, 2, 2);
    }
    g.globalAlpha = 1;
    g.fillStyle = '#f3ecdc';
    g.fillRect(0, 0, 512, 22);
    g.fillRect(0, 268, 512, 14);
    for (let i = 0; i < 4; i++) {
      const x = 40 + i * 122;
      g.fillStyle = '#f3ecdc'; g.fillRect(x - 8, 74, 76, 160);
      g.fillStyle = '#241a10'; g.fillRect(x, 82, 60, 146);
      g.fillStyle = '#3d2b1a'; g.fillRect(x - 14, 214, 88, 9);
      for (let b = 0; b < 10; b++) g.fillRect(x - 12 + b * 8.5, 190, 3, 26);
    }
    for (let i = 0; i < 4; i++) {
      const cx = 64 + i * 128;
      g.fillStyle = '#f3ecdc';
      g.fillRect(cx - 52, 316, 22, 196);
      g.fillRect(cx + 30, 316, 22, 196);
      g.fillStyle = '#1d150c';
      g.beginPath();
      g.moveTo(cx - 38, 512); g.lineTo(cx - 38, 396);
      g.arc(cx, 396, 38, Math.PI, 0);
      g.lineTo(cx + 38, 512); g.closePath(); g.fill();
    }
  });
}

// ---------- Materiales ----------
function ochreMat(repeat) {
  const t = stuccoTexture('#d3a441', '#8a6a24', '#f0d488');
  t.repeat.set(repeat, repeat);
  return new THREE.MeshStandardMaterial({ map: t, roughness: 0.92, metalness: 0 });
}
const matWall = ochreMat(0.25);
const matTower = ochreMat(0.3);
const matTrim = new THREE.MeshStandardMaterial({
  map: stuccoTexture('#efe7d3', '#b8ab8c', '#fffef2'), roughness: 0.85
});
matTrim.map.repeat.set(0.5, 0.5);
const matTrimPlain = new THREE.MeshStandardMaterial({ color: '#efe7d3', roughness: 0.85 });
const matStone = new THREE.MeshStandardMaterial({
  map: stuccoTexture('#9a8f7e', '#5c5344', '#cfc4ae'), roughness: 0.95
});
const matDarkWood = new THREE.MeshStandardMaterial({ color: '#3b2a18', roughness: 0.9 });
const matBronze = new THREE.MeshStandardMaterial({ color: '#3a3128', roughness: 0.55, metalness: 0.6 });
const matGold = new THREE.MeshStandardMaterial({ color: '#caa93f', roughness: 0.35, metalness: 0.85 });
const roofTex = roofTexture();
const matRoof = new THREE.MeshStandardMaterial({ map: roofTex, roughness: 0.95 });
const archOpenTex = archOpeningTexture();
const matArchOpen = new THREE.MeshBasicMaterial({ map: archOpenTex, transparent: true });

// ---------- Colisiones ----------
const colliders = [];
function addCollider(x1, x2, z1, z2) { colliders.push({ x1, x2, z1, z2 }); }

function box(w, h, d, mat, x, y, z, opts = {}) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.castShadow = opts.shadow !== false;
  m.receiveShadow = true;
  if (opts.collide) addCollider(x - w / 2, x + w / 2, z - d / 2, z + d / 2);
  scene.add(m);
  return m;
}

// ---------- Piso ----------
const floorTex = floorTexture();
floorTex.repeat.set(90, 90);
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(320, 320),
  new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.95 })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// ---------- Bahía (lado del muelle) ----------
const water = new THREE.Mesh(
  new THREE.PlaneGeometry(340, 130),
  new THREE.MeshStandardMaterial({ color: '#1d4e63', roughness: 0.2, metalness: 0.55 })
);
water.rotation.x = -Math.PI / 2;
water.position.set(0, 0.04, -123);
scene.add(water);
box(330, 0.9, 1.2, matStone, 0, 0.45, -57.6);

// ---------- Muralla con los tres arcos (Boca del Puente) ----------
const wallShape = new THREE.Shape();
wallShape.moveTo(-45, 0); wallShape.lineTo(45, 0);
wallShape.lineTo(45, 9); wallShape.lineTo(-45, 9); wallShape.closePath();

function archHole(cx, hw, spring) {
  const p = new THREE.Path();
  p.moveTo(cx - hw, 0);
  p.lineTo(cx - hw, spring);
  p.absarc(cx, spring, hw, Math.PI, 0, true);
  p.lineTo(cx + hw, 0);
  p.lineTo(cx - hw, 0);
  return p;
}
wallShape.holes.push(archHole(0, 2.2, 3.6), archHole(-7, 1.4, 2.6), archHole(7, 1.4, 2.6));

const wallGeo = new THREE.ExtrudeGeometry(wallShape, { depth: 6, bevelEnabled: false });
const wall = new THREE.Mesh(wallGeo, matWall);
wall.position.z = -3;
wall.castShadow = wall.receiveShadow = true;
scene.add(wall);

// segmentos sólidos de la muralla (los arcos quedan libres)
addCollider(-45, -8.4, -3, 3);
addCollider(-5.6, -2.2, -3, 3);
addCollider(2.2, 5.6, -3, 3);
addCollider(8.4, 45, -3, 3);

// cornisa superior de la muralla
box(90.6, 0.55, 6.7, matTrim, 0, 9.0, 0, { shadow: false });

// parapetos (excepto la zona del balaustre sobre la puerta)
box(39, 0.9, 0.32, matWall, -25.5, 9.72, 2.84);
box(39, 0.9, 0.32, matWall, 25.5, 9.72, 2.84);
box(39, 0.9, 0.32, matWall, -25.5, 9.72, -2.84);
box(39, 0.9, 0.32, matWall, 25.5, 9.72, -2.84);

// detalles de la fachada: archivoltas, pilastras, clave y placa
function archivolt(cx, r, spring, z) {
  const t = new THREE.Mesh(new THREE.TorusGeometry(r, 0.15, 10, 28, Math.PI), matTrim);
  t.position.set(cx, spring, z);
  t.castShadow = true;
  scene.add(t);
}
for (const z of [3.04, -3.04]) {
  archivolt(0, 2.32, 3.6, z);
  archivolt(-7, 1.5, 2.6, z);
  archivolt(7, 1.5, 2.6, z);
}
box(0.75, 8.7, 0.3, matTrim, -3.15, 4.35, 3.1);
box(0.75, 8.7, 0.3, matTrim, 3.15, 4.35, 3.1);
box(0.5, 0.9, 0.22, matTrim, 0, 6.15, 3.1);
box(1.7, 0.95, 0.16, matTrimPlain, 0, 7.35, 3.06);

// balaustrada sobre la puerta (a los lados de la base de la torre)
const balGeo = new THREE.CylinderGeometry(0.06, 0.09, 0.72, 8);
const balusters = new THREE.InstancedMesh(balGeo, matTrimPlain, 40);
{
  const M = new THREE.Matrix4();
  let i = 0;
  for (const zz of [2.72, -2.72]) {
    for (const sign of [1, -1]) {
      for (let k = 0; k < 5; k++) {
        const bx = sign * (4.0 + k * 0.45);
        M.setPosition(bx, 9.82, zz);
        balusters.setMatrixAt(i++, M);
      }
    }
  }
  balusters.castShadow = true;
  scene.add(balusters);
}
for (const zz of [2.72, -2.72]) {
  for (const sx of [-4.9, 4.9]) {
    box(2.6, 0.2, 0.42, matTrimPlain, sx, 10.26, zz, { shadow: false });
    box(2.6, 0.16, 0.42, matTrimPlain, sx, 9.4, zz, { shadow: false });
  }
}

// ---------- La torre ----------
// cuerpo base cuadrado
box(6.8, 5.5, 6.8, matTower, 0, 11.75, 0);
for (const sx of [-3.25, 3.25]) for (const sz of [-3.25, 3.25])
  box(0.55, 5.5, 0.55, matTrim, sx, 11.75, sz);
// ventanas arqueadas del cuerpo base
for (let k = 0; k < 4; k++) {
  const a = k * Math.PI / 2;
  const win = new THREE.Mesh(new THREE.PlaneGeometry(1.3, 2.6), matArchOpen);
  win.position.set(Math.sin(a) * 3.42, 12.1, Math.cos(a) * 3.42);
  win.rotation.y = a;
  scene.add(win);
  const frame = new THREE.Mesh(new THREE.PlaneGeometry(1.7, 3.0), matTrimPlain);
  frame.position.set(Math.sin(a) * 3.41, 12.1, Math.cos(a) * 3.41);
  frame.rotation.y = a;
  scene.add(frame);
}
// cornisa y pináculos
box(7.9, 0.5, 7.9, matTrim, 0, 14.75, 0);
for (const sx of [-3.6, 3.6]) for (const sz of [-3.6, 3.6]) {
  box(0.18, 0.5, 0.18, matTrimPlain, sx, 15.25, sz, { shadow: false });
  const ball = new THREE.Mesh(new THREE.SphereGeometry(0.27, 12, 10), matTrimPlain);
  ball.position.set(sx, 15.6, sz);
  ball.castShadow = true;
  scene.add(ball);
}

// tambor octogonal con los relojes
const drum = new THREE.Mesh(new THREE.CylinderGeometry(3.3, 3.3, 6.2, 8, 1), matTower);
drum.rotation.y = Math.PI / 8;
drum.position.y = 18.1;
drum.castShadow = drum.receiveShadow = true;
scene.add(drum);

// anillo blanco / cornisa del tambor
const ring1 = new THREE.Mesh(new THREE.CylinderGeometry(3.85, 3.85, 0.42, 8), matTrim);
ring1.rotation.y = Math.PI / 8;
ring1.position.y = 21.35;
ring1.castShadow = true;
scene.add(ring1);

// campanario octogonal
const belfry = new THREE.Mesh(new THREE.CylinderGeometry(2.3, 2.3, 3.2, 8, 1), matTower);
belfry.rotation.y = Math.PI / 8;
belfry.position.y = 23.15;
belfry.castShadow = true;
scene.add(belfry);
for (let k = 0; k < 4; k++) {
  const a = k * Math.PI / 2;
  const op = new THREE.Mesh(new THREE.PlaneGeometry(1.1, 2.2), matArchOpen);
  op.position.set(Math.sin(a) * 2.16, 23.15, Math.cos(a) * 2.16);
  op.rotation.y = a;
  scene.add(op);
}
const ring2 = new THREE.Mesh(new THREE.CylinderGeometry(2.72, 2.72, 0.36, 8), matTrim);
ring2.rotation.y = Math.PI / 8;
ring2.position.y = 24.9;
ring2.castShadow = true;
scene.add(ring2);

// aguja
const spire = new THREE.Mesh(new THREE.ConeGeometry(2.3, 6.6, 8), matTower);
spire.rotation.y = Math.PI / 8;
spire.position.y = 28.35;
spire.castShadow = true;
scene.add(spire);

// esfera dorada + veleta
const orb = new THREE.Mesh(new THREE.SphereGeometry(0.34, 14, 12), matGold);
orb.position.y = 31.95;
scene.add(orb);
const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 1.6, 6), matBronze);
rod.position.y = 32.6;
scene.add(rod);
const vane = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.24, 0.03), matGold);
vane.position.y = 33.0;
vane.rotation.y = 0.6;
scene.add(vane);

// ---------- Los relojes (hora real) ----------
const clockCanvas = document.createElement('canvas');
clockCanvas.width = clockCanvas.height = 512;
const clockTex = new THREE.CanvasTexture(clockCanvas);
clockTex.colorSpace = THREE.SRGBColorSpace;
const ROMANS = ['XII', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI'];

function drawClock(date) {
  const g = clockCanvas.getContext('2d');
  const C = 256;
  g.clearRect(0, 0, 512, 512);
  g.fillStyle = '#f5efdd';
  g.beginPath(); g.arc(C, C, 250, 0, 7); g.fill();
  g.strokeStyle = '#1a1610'; g.lineWidth = 16;
  g.beginPath(); g.arc(C, C, 240, 0, 7); g.stroke();
  g.lineWidth = 3;
  for (let m = 0; m < 60; m++) {
    const a = m * Math.PI / 30;
    const r1 = m % 5 === 0 ? 200 : 216, r2 = 226;
    g.beginPath();
    g.moveTo(C + Math.sin(a) * r1, C - Math.cos(a) * r1);
    g.lineTo(C + Math.sin(a) * r2, C - Math.cos(a) * r2);
    g.stroke();
  }
  g.fillStyle = '#1a1610';
  g.font = 'bold 46px Georgia';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  for (let h = 0; h < 12; h++) {
    const a = h * Math.PI / 6;
    g.fillText(ROMANS[h], C + Math.sin(a) * 168, C - Math.cos(a) * 168);
  }
  const hr = (date.getHours() % 12) + date.getMinutes() / 60;
  const mn = date.getMinutes() + date.getSeconds() / 60;
  function hand(angle, len, width) {
    g.save();
    g.translate(C, C); g.rotate(angle);
    g.fillStyle = '#14100a';
    g.beginPath();
    g.moveTo(-width, 26); g.lineTo(width, 26);
    g.lineTo(width * 0.4, -len); g.lineTo(-width * 0.4, -len);
    g.closePath(); g.fill();
    g.restore();
  }
  hand(hr * Math.PI / 6, 118, 12);
  hand(mn * Math.PI / 30, 178, 8);
  g.fillStyle = '#14100a';
  g.beginPath(); g.arc(C, C, 14, 0, 7); g.fill();
  clockTex.needsUpdate = true;
}
drawClock(new Date());

const clockMat = new THREE.MeshStandardMaterial({
  map: clockTex, emissiveMap: clockTex, emissive: '#ffffff', emissiveIntensity: 0, roughness: 0.6
});
for (let k = 0; k < 4; k++) {
  const a = k * Math.PI / 2;
  const face = new THREE.Mesh(new THREE.CircleGeometry(1.55, 40), clockMat);
  face.position.set(Math.sin(a) * 3.1, 18.6, Math.cos(a) * 3.1);
  face.rotation.y = a;
  scene.add(face);
  const frame = new THREE.Mesh(new THREE.TorusGeometry(1.62, 0.12, 10, 40), matTrimPlain);
  frame.position.set(Math.sin(a) * 3.08, 18.6, Math.cos(a) * 3.08);
  frame.rotation.y = a;
  frame.castShadow = true;
  scene.add(frame);
}

// ---------- Plaza de los Coches: portales y casas coloniales ----------
const paletteColors = ['#c34f3a', '#2e6f8e', '#c9a13b', '#7a5e8f', '#b8672e', '#4a7a52'];
function addBuilding(x, z, w, d, h, facing) {
  const front = new THREE.MeshStandardMaterial({
    map: facadeTexture(paletteColors[Math.floor(Math.random() * paletteColors.length)]),
    roughness: 0.92
  });
  const side = new THREE.MeshStandardMaterial({
    map: stuccoTexture('#d8cbb0', '#8a7c60', '#fff6e0'), roughness: 0.95
  });
  // orden de caras: +x, -x, +y, -y, +z, -z
  const mats = [side, side, side, side, side, side];
  if (facing === 'S') mats[5] = front;       // mira hacia -z
  else if (facing === 'W') mats[1] = front;  // mira hacia -x
  else if (facing === 'E') mats[0] = front;  // mira hacia +x
  const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mats);
  b.position.set(x, h / 2, z);
  b.castShadow = b.receiveShadow = true;
  scene.add(b);
  addCollider(x - w / 2, x + w / 2, z - d / 2, z + d / 2);
  const roof = new THREE.Mesh(new THREE.BoxGeometry(w + 0.9, 0.5, d + 0.9), matRoof);
  roof.position.set(x, h + 0.25, z);

function addPalm(x, z) {
  const g = new THREE.Group();
  const lean = (Math.random() - 0.5) * 0.5;
  const hSeg = 1.35, nSeg = 5;
  let ox = 0;
  for (let i = 0; i < nSeg; i++) {
    const seg = new THREE.Mesh(new THREE.CylinderGeometry(0.13 - i * 0.008, 0.17 - i * 0.008, hSeg, 8), matTrunk);
    ox += lean * 0.28;
    seg.position.set(ox, hSeg / 2 + i * hSeg, 0);
    seg.rotation.z = -lean * 0.25;
    seg.castShadow = true;
    g.add(seg);
  }
  const topY = nSeg * hSeg, topX = ox;
  for (let i = 0; i < 9; i++) {
    const f = new THREE.Mesh(new THREE.PlaneGeometry(0.95, 3.1), matFrond);
    const a = i * Math.PI * 2 / 9;
    f.position.set(topX, topY + 0.35, 0);
    f.rotation.order = 'YXZ';
    f.rotation.y = a;
    f.rotation.x = -1.05 - Math.random() * 0.45;
    f.geometry.translate(0, -1.4, 0);
    f.castShadow = true;
    g.add(f);
  }
  for (let i = 0; i < 3; i++) {
    const c = new THREE.Mesh(new THREE.SphereGeometry(0.11, 8, 6), new THREE.MeshStandardMaterial({ color: '#6b4a1e', roughness: 1 }));
    c.position.set(topX + (Math.random() - 0.5) * 0.5, topY, (Math.random() - 0.5) * 0.5);
    g.add(c);
  }
  g.position.set(x, 0, z);
  scene.add(g);
  addCollider(x - 0.3, x + 0.3, z - 0.3, z + 0.3);
}

    scene.fog.color.set('#e8dbc4');

    sunSprite.visible = true;

    lampLights.forEach(l => l.intensity = 0);

  }
}

// ---------- Controles POV ----------
const controls = new PointerLockControls(camera, document.body);
const overlay = document.getElementById('overlay');
const crosshair = document.getElementById('crosshair');
const hud = document.getElementById('hud');

overlay.addEventListener('click', () => controls.lock());
controls.addEventListener('lock', () => {
  overlay.style.display = 'none';
  crosshair.style.display = 'block';
  hud.style.display = 'block';
});
controls.addEventListener('unlock', () => {
  overlay.style.display = 'flex';
  crosshair.style.display = 'none';
  hud.style.display = 'none';
});

const keys = {};
addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (e.code === 'Space') e.preventDefault();
  if (e.code === 'KeyN' && controls.isLocked) { isNight = !isNight; applyTime(); }
});
addEventListener('keyup', (e) => { keys[e.code] = false; });

const PLAYER_R = 0.45;
let velY = 0;
let onGround = true;

function hitsCollider(x, z) {
  for (const c of colliders) {
    if (x > c.x1 - PLAYER_R && x < c.x2 + PLAYER_R && z > c.z1 - PLAYER_R && z < c.z2 + PLAYER_R) return true;
  }
  return false;
}

const fwd = new THREE.Vector3();
const rightV = new THREE.Vector3();
const UP = new THREE.Vector3(0, 1, 0);

function updatePlayer(dt) {
  if (!controls.isLocked) return;
  const run = keys['ShiftLeft'] || keys['ShiftRight'];
  const speed = run ? 9.5 : 4.6;

  camera.getWorldDirection(fwd);
  fwd.y = 0; fwd.normalize();
  rightV.crossVectors(fwd, UP);

  let mx = 0, mz = 0;
  const f = (keys['KeyW'] || keys['ArrowUp'] ? 1 : 0) - (keys['KeyS'] || keys['ArrowDown'] ? 1 : 0);
  const s = (keys['KeyD'] || keys['ArrowRight'] ? 1 : 0) - (keys['KeyA'] || keys['ArrowLeft'] ? 1 : 0);
  if (f || s) {
    const len = Math.hypot(f, s);
    mx = (fwd.x * f / len + rightV.x * s / len) * speed * dt;
    mz = (fwd.z * f / len + rightV.z * s / len) * speed * dt;
  }

  const p = camera.position;
  if (!hitsCollider(p.x + mx, p.z)) p.x += mx;
  if (!hitsCollider(p.x, p.z + mz)) p.z += mz;
  p.x = Math.max(-145, Math.min(145, p.x));
  p.z = Math.max(-55, Math.min(145, p.z));

  if (keys['Space'] && onGround) { velY = 6.4; onGround = false; }
  velY -= 17 * dt;
  p.y += velY * dt;
  if (p.y < 1.7) { p.y = 1.7; velY = 0; onGround = true; }
}

// ---------- Bucle principal ----------
const clock3 = new THREE.Clock();
let lastSec = -1;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock3.getDelta(), 0.05);

  updatePlayer(dt);

  const now = new Date();
  if (now.getSeconds() !== lastSec) {
    lastSec = now.getSeconds();
    drawClock(now);
  }

  for (const c of clouds) {
    c.position.x += dt * 1.2;
    if (c.position.x > 240) c.position.x = -240;
  }

  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
